<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<title>S2 theme harness</title>
<link rel="stylesheet" href="/node_modules/pdfjs-dist/web/pdf_viewer.css" />
<style>
  html, body { margin: 0; height: 100%; background: #444; }
  #container { position: absolute; inset: 0; overflow: auto; }
  /* cssFilter strategy: exact token mapping via per-channel linear maps (sRGB) */
  .t-warm .canvasWrapper { filter: url(#mg-warm); }
  .t-dark .canvasWrapper { filter: hue-rotate(180deg) url(#mg-dark); }
  .t-dark .pdfViewer .page, .t-warm .pdfViewer .page { --page-bg-color: transparent; }
  .mg-img-restore { position: absolute; inset: 0; pointer-events: none; }
  .mg-img-restore canvas { position: absolute; }
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- c' = fg + (bg - fg) * c : black -> fg, white -> bg (warm: #3B2F2F on #F4ECD8) -->
    <filter id="mg-warm" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="linear" intercept="0.2314" slope="0.7255" />
        <feFuncG type="linear" intercept="0.1843" slope="0.7412" />
        <feFuncB type="linear" intercept="0.1843" slope="0.6627" />
      </feComponentTransfer>
    </filter>
    <!-- after hue-rotate(180deg): black -> #E6E1D6, white -> #121212 (luminance inverted, hue kept) -->
    <filter id="mg-dark" color-interpolation-filters="sRGB">
      <feComponentTransfer>
        <feFuncR type="linear" intercept="0.9020" slope="-0.8314" />
        <feFuncG type="linear" intercept="0.8824" slope="-0.8118" />
        <feFuncB type="linear" intercept="0.8392" slope="-0.7686" />
      </feComponentTransfer>
    </filter>
  </defs>
</svg>
<div id="container"><div class="pdfViewer"></div></div>
<script type="module">
  import * as pdfjsLib from '/node_modules/pdfjs-dist/build/pdf.mjs';
  globalThis.pdfjsLib = pdfjsLib;
  const { PDFViewer, EventBus, PDFLinkService } = await import('/node_modules/pdfjs-dist/web/pdf_viewer.mjs');
  pdfjsLib.GlobalWorkerOptions.workerSrc = '/node_modules/pdfjs-dist/build/pdf.worker.mjs';

  const TOKENS = { warm: { background: '#F4ECD8', foreground: '#3B2F2F' }, dark: { background: '#121212', foreground: '#E6E1D6' } };
  const container = document.getElementById('container');
  let doc = null, viewer = null, eventBus = null, restore = false, scale = 1;

  function build(pageColors) {
    viewer?.setDocument(null);
    container.innerHTML = '<div class="pdfViewer"></div>';
    eventBus = new EventBus();
    const linkService = new PDFLinkService({ eventBus });
    viewer = new PDFViewer({ container, eventBus, linkService, pageColors, imagesRightClickMinSize: 16, maxCanvasPixels: 16777216 });
    linkService.setViewer(viewer);
    eventBus.on('pagerendered', (e) => restoreImages(viewer.getPageView(e.pageNumber - 1)));
    eventBus.on('pagesinit', () => { viewer.currentScale = scale; });
    viewer.setDocument(doc);
    linkService.setDocument(doc);
  }

  function rendered(n = 1) {
    return new Promise((resolve) => {
      const on = (e) => { if (e.pageNumber === n) { eventBus.off('pagerendered', on); resolve(); } };
      eventBus.on('pagerendered', on);
    });
  }
  const frames = () => new Promise((r) => requestAnimationFrame(() => requestAnimationFrame(r)));

  // Restore images to their original (unfiltered) pixels: the CSS filter applies only at composite time,
  // so the page canvas still holds the original image pixels at the coordinates PDF.js recorded.
  function restoreImages(pv) {
    pv.div.querySelector('.mg-img-restore')?.remove();
    const coords = pv.pdfPage?.imageCoordinates, canvas = pv.canvas;
    if (!restore || !coords?.length || !canvas) return 0;
    const layer = document.createElement('div');
    layer.className = 'mg-img-restore';
    let area = 0;
    for (let i = 0; i < coords.length; i += 6) {
      const [x1, y1, x2, y2, x3, y3] = coords.subarray(i, i + 6);
      const xs = [x1, x2, x3, x2 + x3 - x1], ys = [y1, y2, y3, y2 + y3 - y1];
      const L = Math.max(0, Math.min(...xs)), R = Math.min(1, Math.max(...xs)), T = Math.max(0, Math.min(...ys)), B = Math.min(1, Math.max(...ys));
      area += (R - L) * (B - T);
      const sx = Math.floor(L * canvas.width), sy = Math.floor(T * canvas.height);
      const sw = Math.ceil(R * canvas.width) - sx, sh = Math.ceil(B * canvas.height) - sy;
      if (sw < 4 || sh < 4) continue;
      const c = document.createElement('canvas');
      c.width = sw; c.height = sh;
      c.getContext('2d').drawImage(canvas, sx, sy, sw, sh, 0, 0, sw, sh);
      Object.assign(c.style, { left: `${(100 * sx) / canvas.width}%`, top: `${(100 * sy) / canvas.height}%`, width: `${(100 * sw) / canvas.width}%`, height: `${(100 * sh) / canvas.height}%` });
      layer.append(c);
    }
    if (area > 0.8) return area; // scanned/image-only page: keep it filtered (invert) like the rest
    pv.div.querySelector('.canvasWrapper').after(layer);
    return area;
  }

  window.api = {
    async load(file, pageScale) {
      doc = await pdfjsLib.getDocument({ url: file, isEvalSupported: false, cMapUrl: '/node_modules/pdfjs-dist/cmaps/', cMapPacked: true, standardFontDataUrl: '/node_modules/pdfjs-dist/standard_fonts/' }).promise;
      scale = pageScale;
      document.body.className = '';
      build(null);
      await rendered(1);
      return doc.numPages;
    },
    async goto(n) {
      const pv = viewer.getPageView(n - 1);
      const r = pv.renderingState === 3 ? Promise.resolve() : rendered(n);
      viewer.currentPageNumber = n;
      await r;
      await frames();
    },
    /** cssFilter strategy: class switch only; no re-render. */
    async css(theme, restoreImgs) {
      const t0 = performance.now();
      restore = restoreImgs;
      document.body.className = theme === 'light' ? '' : `t-${theme}`;
      for (let i = 0; i < viewer.pagesCount; i++) {
        const pv = viewer.getPageView(i);
        if (pv.renderingState === 3) restoreImages(pv); // finished pages only
      }
      await frames();
      return performance.now() - t0;
    },
    /** pageColors strategy: no runtime setter in 6.3.289 -> rebuild the viewer, re-render visible pages. */
    async pageColors(theme, page) {
      const t0 = performance.now();
      restore = false;
      document.body.className = '';
      build(theme === 'light' ? null : TOKENS[theme]);
      eventBus.on('pagesinit', () => { viewer.currentPageNumber = page; });
      await rendered(page);
      await frames();
      return performance.now() - t0;
    },
    pageBox(n) {
      const r = viewer.getPageView(n - 1).div.getBoundingClientRect();
      return { x: r.x, y: r.y, width: r.width, height: r.height, canvas: [viewer.getPageView(n - 1).canvas?.width, viewer.getPageView(n - 1).canvas?.height] };
    },
    imageArea(n) {
      const c = viewer.getPageView(n - 1).pdfPage?.imageCoordinates;
      return c ? c.length / 6 : 0;
    },
  };
  window.ready = true;
</script>
</body>
</html>
